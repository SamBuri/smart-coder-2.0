server:
    port: ${PORT:9797}

spring:
    web:
        resources:
            add-mappings: false
    application:
        name: smart-coder

    datasource:
        url: jdbc:h2:file:${user.home}/.smart-coder/smartcoder;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
        driver-class-name: org.h2.Driver
        username: sa
        password:
        hikari:
            maximum-pool-size: 5
            connection-timeout: 30000

    jpa:
        database-platform: org.hibernate.dialect.H2Dialect
        hibernate:
            ddl-auto: update
        show-sql: false
        properties:
            hibernate:
                format_sql: true

    h2:
        console:
            enabled: true
            path: /h2-console

    liquibase:
        enabled: false
management:
    endpoints:
        web:
            exposure:
                include: health
cors:
    allowed-origins: http://localhost:3000,tauri://localhost,https://tauri.localhost
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600
