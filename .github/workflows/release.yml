build-tauri:
  needs: build-sidecar
  permissions:
    contents: write
  strategy:
    fail-fast: false
    matrix:
      include:
        - platform: 'ubuntu-22.04' # Linux
        - platform: 'windows-latest' # Windows
        - platform: 'macos-latest' # macOS
  runs-on: ${{ matrix.platform }}
  steps:
    - uses: actions/checkout@v4

    - name: Install Linux Dependencies (Linux Only)
      if: matrix.platform == 'ubuntu-22.04'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev webkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

    - name: Download Sidecar
      uses: actions/download-artifact@v4
      with:
        name: backend-binary
        path: smart-coder-ui/src-tauri/binaries

    # --- RENAME SIDECAR FOR WINDOWS/MAC ---
    - name: Rename Sidecar for Platform
      shell: bash
      run: |
        cd smart-coder-ui/src-tauri/binaries
        if [ "${{ matrix.platform }}" == "windows-latest" ]; then
          mv backend-x86_64-unknown-linux-gnu backend-x86_64-pc-windows-msvc.exe
        elif [ "${{ matrix.platform }}" == "macos-latest" ]; then
          mv backend-x86_64-unknown-linux-gnu backend-x86_64-apple-darwin
        fi

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm'
        cache-dependency-path: smart-coder-ui/package-lock.json

    - name: Install Frontend Deps
      run: cd smart-coder-ui && npm install

    - name: Build Tauri App
      uses: tauri-apps/tauri-action@v0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        projectPath: smart-coder-ui
        tagName: v__VERSION__
        releaseName: "Smart-Coder v__VERSION__"
